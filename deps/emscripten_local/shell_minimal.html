<!doctype html>
<html lang="en-us">
    <head>
        <title>Maze Builder - LOCAL</title>

        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="title" content="Maze Builder web app" />
        <meta
            name="description"
            content="Build mazes and download, save for later"
        />
        <meta
            name="keywords"
            content="mazes, programming, examples, html5, C, C++, library, learn, prototype, videogames"
        />
        <meta
            name="viewport"
            content="width=1080, height=720 initial-scale=1.0"
        />
        <link rel="shortcut icon" href="favicon.ico" />
        <style>
            @-webkit-keyframes rotation {
                from {
                    -webkit-transform: rotate(0deg);
                }
                to {
                    -webkit-transform: rotate(360deg);
                }
            }
            @-moz-keyframes rotation {
                from {
                    -moz-transform: rotate(0deg);
                }
                to {
                    -moz-transform: rotate(360deg);
                }
            }
            @-o-keyframes rotation {
                from {
                    -o-transform: rotate(0deg);
                }
                to {
                    -o-transform: rotate(360deg);
                }
            }
            @keyframes rotation {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }

            html,
            body {
                width: 100%;
                height: 100%;
                font-family: arial;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: black;
            }

            .emscripten {
                padding-right: 0;
                margin: 0;
                display: block;
            }

            .viewport {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                overflow: hidden;
            }

            div.emscripten_border {
                position: absolute;
                inset: 0;
                border: 0;
            }

            canvas.emscripten {
                position: absolute;
                inset: 0;
                border: 0px none;
                background: black;
                width: 100%;
                height: 100%;
                display: block;
            }

            .overlay {
                position: fixed;
                left: 50%;
                top: 16px;
                transform: translateX(-50%);
                z-index: 10;
                text-align: center;
                pointer-events: none;
                color: white;
            }

            .overlay[hidden] {
                display: none;
            }

            .spinner {
                height: 50px;
                width: 50px;
                margin: 0 auto 12px;
                -webkit-animation: rotation 0.8s infinite linear;
                -moz-animation: rotation 0.8s infinite linear;
                -o-animation: rotation 0.8s infinite linear;
                animation: rotation 0.8s infinite linear;
                border-left: 10px solid rgb(0, 150, 240);
                border-right: 10px solid rgb(0, 150, 240);
                border-bottom: 10px solid rgb(0, 150, 240);
                border-top: 10px solid rgb(100, 0, 200);
                border-radius: 100%;
                background-color: rgb(200, 100, 250);
            }

            #status,
            #progress,
            #output {
                pointer-events: auto;
            }

            #status {
                display: inline-block;
                max-width: calc(100vw - 32px);
                padding: 8px 12px;
                border-radius: 999px;
                background: rgba(0, 0, 0, 0.6);
                backdrop-filter: blur(8px);
            }

            textarea.emscripten {
                font-family: monospace;
                position: fixed;
                left: -10000px;
                top: 0;
                width: 640px;
                height: 120px;
                resize: none;
                z-index: 10;
                background: rgba(0, 0, 0, 0.75);
                color: white;
                border: 1px solid rgba(255, 255, 255, 0.2);
            }

            progress {
                width: min(320px, calc(100vw - 32px));
                height: 30px;
                margin-top: 12px;
            }
        </style>
    </head>
    <body>
        <div class="viewport">
            <div class="overlay" id="overlay">
                <div class="spinner" id="spinner"></div>
                <div class="emscripten" id="status">Downloading...</div>
                <div class="emscripten">
                    <progress value="0" max="100" id="progress" hidden="1"></progress>
                </div>
            </div>
            <div class="emscripten_border">
                <canvas
                    class="emscripten"
                    id="canvas"
                    oncontextmenu="event.preventDefault()"
                    tabindex="-1"
                ></canvas>
            </div>
        </div>
        <textarea class="emscripten" id="output" rows="8"></textarea>

        <script type="text/javascript">
            var statusElement = document.getElementById("status");
            var progressElement = document.getElementById("progress");
            var spinnerElement = document.getElementById("spinner");
            var overlayElement = document.getElementById("overlay");
            var canvasElement = document.getElementById("canvas");
            var outputElement = document.getElementById("output");
            if (outputElement) outputElement.value = ""; // clear browser cache

            // Work around browsers rejecting growable/resizable buffer views in WebGL uniform calls.
            (function installUniformUploadPatch() {
                const proto =
                    globalThis.WebGL2RenderingContext &&
                    WebGL2RenderingContext.prototype;
                if (!proto || proto.__maze_uniform_upload_patch_applied) {
                    return;
                }

                Object.defineProperty(
                    proto,
                    "__maze_uniform_upload_patch_applied",
                    {
                        value: true,
                        configurable: false,
                        enumerable: false,
                        writable: false,
                    },
                );

                const patchedMethods = [
                    "uniform1fv",
                    "uniform2fv",
                    "uniform3fv",
                    "uniform4fv",
                    "uniformMatrix2fv",
                    "uniformMatrix3fv",
                    "uniformMatrix4fv",
                    "uniformMatrix2x3fv",
                    "uniformMatrix2x4fv",
                    "uniformMatrix3x2fv",
                    "uniformMatrix3x4fv",
                    "uniformMatrix4x2fv",
                    "uniformMatrix4x3fv",
                ];

                const needsCopy = (view) =>
                    !!(
                        view &&
                        ArrayBuffer.isView(view) &&
                        view.buffer &&
                        (view.buffer.resizable === true ||
                            view.buffer.growable === true)
                    );

                const copySafeRange = (view, srcOffset, srcLength) => {
                    const start = Math.max(0, srcOffset | 0);
                    const available = Math.max(0, view.length - start);
                    const requested =
                        srcLength != null
                            ? Math.max(0, srcLength | 0)
                            : available;
                    const safeLength = Math.min(requested, available);
                    if (safeLength <= 0) {
                        return null;
                    }

                    const copy = new Float32Array(safeLength);
                    copy.set(view.subarray(start, start + safeLength));
                    return copy;
                };

                for (const methodName of patchedMethods) {
                    const original = proto[methodName];
                    if (typeof original !== "function") {
                        continue;
                    }

                    proto[methodName] = function (...args) {
                        // uniform*fv(location, data[, srcOffset[, srcLength]])
                        if (
                            methodName.startsWith("uniform") &&
                            !methodName.startsWith("uniformMatrix")
                        ) {
                            const data = args[1];
                            if (!needsCopy(data)) {
                                return original.apply(this, args);
                            }

                            const copied = copySafeRange(
                                data,
                                args[2],
                                args[3],
                            );
                            if (!copied) {
                                return;
                            }
                            return original.call(this, args[0], copied);
                        }

                        // uniformMatrix*fv(location, transpose, data[, srcOffset[, srcLength]])
                        const data = args[2];
                        if (!needsCopy(data)) {
                            return original.apply(this, args);
                        }

                        const copied = copySafeRange(data, args[3], args[4]);
                        if (!copied) {
                            return;
                        }
                        return original.call(this, args[0], args[1], copied);
                    };
                }
            })();

            // Work around browsers rejecting or mis-validating growable buffer ranges
            // for WebGL bufferData/bufferSubData overloads with srcOffset/srcLength.
            (function installBufferUploadPatch() {
                const patchProto = (proto, guardName) => {
                    if (!proto || proto[guardName]) {
                        return;
                    }

                    Object.defineProperty(proto, guardName, {
                        value: true,
                        configurable: false,
                        enumerable: false,
                        writable: false,
                    });

                    const needsCopy = (view) =>
                        !!(
                            view &&
                            ArrayBuffer.isView(view) &&
                            view.buffer &&
                            (view.buffer.resizable === true ||
                                view.buffer.growable === true)
                        );

                    const copySafeRange = (view, srcOffset, srcLength) => {
                        const start = Math.max(0, srcOffset | 0);
                        const available = Math.max(0, view.length - start);
                        const requested =
                            srcLength != null
                                ? Math.max(0, srcLength | 0)
                                : available;
                        const safeLength = Math.min(requested, available);
                        if (safeLength <= 0) {
                            return null;
                        }

                        const copy = new Uint8Array(safeLength);
                        copy.set(view.subarray(start, start + safeLength));
                        return copy;
                    };

                    const originalBufferData = proto.bufferData;
                    if (typeof originalBufferData === "function") {
                        proto.bufferData = function (
                            target,
                            srcOrSize,
                            usage,
                            srcOffset,
                            srcLength,
                        ) {
                            if (
                                !ArrayBuffer.isView(srcOrSize) ||
                                !needsCopy(srcOrSize)
                            ) {
                                return originalBufferData.apply(
                                    this,
                                    arguments,
                                );
                            }

                            if (arguments.length >= 4) {
                                const copied = copySafeRange(
                                    srcOrSize,
                                    srcOffset,
                                    srcLength,
                                );
                                if (!copied) {
                                    return;
                                }
                                return originalBufferData.call(
                                    this,
                                    target,
                                    copied,
                                    usage,
                                );
                            }

                            const copied = new Uint8Array(
                                srcOrSize.length >>> 0,
                            );
                            copied.set(srcOrSize.subarray(0, srcOrSize.length));
                            return originalBufferData.call(
                                this,
                                target,
                                copied,
                                usage,
                            );
                        };
                    }

                    const originalBufferSubData = proto.bufferSubData;
                    if (typeof originalBufferSubData === "function") {
                        proto.bufferSubData = function (
                            target,
                            dstByteOffset,
                            srcData,
                            srcOffset,
                            srcLength,
                        ) {
                            if (
                                !ArrayBuffer.isView(srcData) ||
                                !needsCopy(srcData)
                            ) {
                                return originalBufferSubData.apply(
                                    this,
                                    arguments,
                                );
                            }

                            if (arguments.length >= 4) {
                                const copied = copySafeRange(
                                    srcData,
                                    srcOffset,
                                    srcLength,
                                );
                                if (!copied) {
                                    return;
                                }
                                return originalBufferSubData.call(
                                    this,
                                    target,
                                    dstByteOffset,
                                    copied,
                                );
                            }

                            const copied = new Uint8Array(srcData.length >>> 0);
                            copied.set(srcData.subarray(0, srcData.length));
                            return originalBufferSubData.call(
                                this,
                                target,
                                dstByteOffset,
                                copied,
                            );
                        };
                    }
                };

                patchProto(
                    globalThis.WebGL2RenderingContext &&
                        WebGL2RenderingContext.prototype,
                    "__maze_buffer_upload_patch_applied_gl2",
                );
                patchProto(
                    globalThis.WebGLRenderingContext &&
                        WebGLRenderingContext.prototype,
                    "__maze_buffer_upload_patch_applied_gl1",
                );
            })();

            // Work around typed-array texImage2D/texSubImage2D srcOffset range issues
            // that can occur with growable/resizable wasm-backed buffers.
            (function installTextureUploadPatch() {
                const patchProto = (proto, guardName) => {
                    if (!proto || proto[guardName]) {
                        return;
                    }

                    Object.defineProperty(proto, guardName, {
                        value: true,
                        configurable: false,
                        enumerable: false,
                        writable: false,
                    });

                    const bytesPerComponent = (type) => {
                        switch (type) {
                            case 0x1400: // BYTE
                            case 0x1401: // UNSIGNED_BYTE
                                return 1;
                            case 0x1402: // SHORT
                            case 0x1403: // UNSIGNED_SHORT
                            case 0x140b: // HALF_FLOAT
                            case 0x8033: // UNSIGNED_SHORT_4_4_4_4
                            case 0x8034: // UNSIGNED_SHORT_5_5_5_1
                            case 0x8363: // UNSIGNED_SHORT_5_6_5
                                return 2;
                            case 0x1404: // INT
                            case 0x1405: // UNSIGNED_INT
                            case 0x1406: // FLOAT
                            case 0x84fa: // UNSIGNED_INT_24_8
                            case 0x8c3b: // UNSIGNED_INT_10F_11F_11F_REV
                            case 0x8c3e: // UNSIGNED_INT_5_9_9_9_REV
                                return 4;
                            default:
                                return 1;
                        }
                    };

                    const componentsForFormat = (format) => {
                        switch (format) {
                            case 0x1906: // ALPHA
                            case 0x1903: // RED
                            case 0x1909: // LUMINANCE
                                return 1;
                            case 0x8227: // RG
                            case 0x190a: // LUMINANCE_ALPHA
                                return 2;
                            case 0x1907: // RGB
                                return 3;
                            case 0x1908: // RGBA
                                return 4;
                            default:
                                return 4;
                        }
                    };

                    const requiredBytes = (width, height, format, type) => {
                        const w = Math.max(0, width | 0);
                        const h = Math.max(0, height | 0);
                        return (
                            w *
                            h *
                            componentsForFormat(format) *
                            bytesPerComponent(type)
                        );
                    };

                    const buildSafeView = (
                        srcView,
                        srcOffsetElems,
                        reqBytes,
                    ) => {
                        const ctor = srcView.constructor;
                        const elemBytes = srcView.BYTES_PER_ELEMENT || 1;
                        const reqElems = Math.max(
                            0,
                            Math.ceil(reqBytes / elemBytes),
                        );
                        const out = new ctor(reqElems);
                        const start = Math.max(0, srcOffsetElems | 0);
                        const available = Math.max(0, srcView.length - start);
                        const copyElems = Math.min(reqElems, available);
                        if (copyElems > 0) {
                            out.set(srcView.subarray(start, start + copyElems));
                        }
                        return out;
                    };

                    const originalTexSubImage2D = proto.texSubImage2D;
                    if (typeof originalTexSubImage2D === "function") {
                        proto.texSubImage2D = function (...args) {
                            // Typed array overload: target, level, xoff, yoff, width, height, format, type, srcData[, srcOffset]
                            if (
                                args.length >= 9 &&
                                ArrayBuffer.isView(args[8])
                            ) {
                                const srcData = args[8];
                                const srcOffset =
                                    args.length >= 10 ? args[9] | 0 : 0;
                                const req = requiredBytes(
                                    args[4],
                                    args[5],
                                    args[6],
                                    args[7],
                                );
                                const safe = buildSafeView(
                                    srcData,
                                    srcOffset,
                                    req,
                                );
                                return originalTexSubImage2D.call(
                                    this,
                                    args[0],
                                    args[1],
                                    args[2],
                                    args[3],
                                    args[4],
                                    args[5],
                                    args[6],
                                    args[7],
                                    safe,
                                );
                            }
                            return originalTexSubImage2D.apply(this, args);
                        };
                    }

                    const originalTexImage2D = proto.texImage2D;
                    if (typeof originalTexImage2D === "function") {
                        proto.texImage2D = function (...args) {
                            // Typed array overload: target, level, internalformat, width, height, border, format, type, srcData[, srcOffset]
                            if (
                                args.length >= 9 &&
                                ArrayBuffer.isView(args[8]) &&
                                typeof args[3] === "number" &&
                                typeof args[4] === "number"
                            ) {
                                const srcData = args[8];
                                const srcOffset =
                                    args.length >= 10 ? args[9] | 0 : 0;
                                const req = requiredBytes(
                                    args[3],
                                    args[4],
                                    args[6],
                                    args[7],
                                );
                                const safe = buildSafeView(
                                    srcData,
                                    srcOffset,
                                    req,
                                );
                                return originalTexImage2D.call(
                                    this,
                                    args[0],
                                    args[1],
                                    args[2],
                                    args[3],
                                    args[4],
                                    args[5],
                                    args[6],
                                    args[7],
                                    safe,
                                );
                            }
                            return originalTexImage2D.apply(this, args);
                        };
                    }
                };

                patchProto(
                    globalThis.WebGL2RenderingContext &&
                        WebGL2RenderingContext.prototype,
                    "__maze_texture_upload_patch_applied_gl2",
                );
                patchProto(
                    globalThis.WebGLRenderingContext &&
                        WebGLRenderingContext.prototype,
                    "__maze_texture_upload_patch_applied_gl1",
                );
            })();

            // As a default initial behavior, pop up an alert when webgl context is lost. To make your
            // application robust, you may want to override this behavior before shipping!
            // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
            canvasElement.addEventListener(
                "webglcontextlost",
                (e) => {
                    alert(
                        "WebGL context lost. You will need to reload the page.",
                    );
                    e.preventDefault();
                },
                false,
            );

            const Module = {
                // Ensure SDL can safely override this hook during runtime init.
                requestFullscreen: undefined,
                print(...args) {
                    console.log(...args);
                    // These replacements are necessary if you render to raw HTML
                    //text = text.replace(/&/g, "&amp;");
                    //text = text.replace(/</g, "&lt;");
                    //text = text.replace(/>/g, "&gt;");
                    //text = text.replace('\n', '<br>', 'g');
                    if (outputElement) {
                        var text = args.join(" ");
                        outputElement.value += text + "\n";
                        outputElement.scrollTop = outputElement.scrollHeight; // focus on bottom
                    }
                },
                canvas: canvasElement,
                setStatus(text) {
                    if (!Module.setStatus.last)
                        Module.setStatus.last = { time: Date.now(), text: "" };
                    if (text === Module.setStatus.last.text) return;
                    const m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                    const now = Date.now();
                    // if this is a progress update, skip it if too soon
                    if (m && now - Module.setStatus.last.time < 30) return;
                    Module.setStatus.last.time = now;
                    Module.setStatus.last.text = text;
                    if (m) {
                        text = m[1];
                        progressElement.value = parseInt(m[2]) * 100;
                        progressElement.max = parseInt(m[4]) * 100;
                        progressElement.hidden = false;
                        spinnerElement.hidden = false;
                        if (overlayElement) overlayElement.hidden = false;
                    } else {
                        progressElement.value = null;
                        progressElement.max = null;
                        progressElement.hidden = true;
                        if (!text) {
                            spinnerElement.style.display = "none";
                            if (overlayElement) overlayElement.hidden = true;
                        } else {
                            if (overlayElement) overlayElement.hidden = false;
                            spinnerElement.style.display = "block";
                        }
                    }
                    statusElement.innerHTML = text;
                },
                totalDependencies: 0,
                monitorRunDependencies(left) {
                    this.totalDependencies = Math.max(
                        this.totalDependencies,
                        left,
                    );
                    Module.setStatus(
                        left
                            ? "Preparing... (" +
                                  (this.totalDependencies - left) +
                                  "/" +
                                  this.totalDependencies +
                                  ")"
                            : "All downloads complete.",
                    );
                },
                onRuntimeInitialized() {
                    if (overlayElement) overlayElement.hidden = true;

                    // Get the instance once
                    let inst = null;
                    try {
                        console.log("Calling Module.get()...");
                        inst = Module.get();
                        console.log("Instance retrieved:", inst);
                    } catch (e) {
                        console.error("Error calling Module.get():", e);
                        Module.print("Error: " + e.message);
                        return;
                    }

                    // Poll is_download_ready() every 3-5ms (using 4ms as middle ground)
                    let pollCount = 0;
                    const pollInterval = setInterval(() => {
                        pollCount++;
                        try {
                            const isReady = inst.is_download_ready();

                            // Log every ~1 second
                            if (pollCount % 250 === 0) {
                                console.log(
                                    `Polling is_download_ready() [${pollCount}]: ${isReady}`,
                                );
                            }

                            if (isReady) {
                                clearInterval(pollInterval);
                                console.log(
                                    "Download ready! Calling artifacts()...",
                                );
                                Module.print(
                                    "Download ready! Retrieving artifacts...",
                                );

                                // Get the artifacts
                                const result = inst.artifacts();
                                console.log(
                                    "Artifacts retrieved, length:",
                                    result.length,
                                );

                                // Check if artifacts are not empty
                                if (!result || result.length === 0) {
                                    console.warn("Artifacts are empty!");
                                    Module.print(
                                        "Warning: Artifacts are empty, nothing to download.",
                                    );
                                    return;
                                }

                                Module.print(
                                    `Artifacts retrieved: ${result.length} characters`,
                                );

                                // Create a blob from the artifacts string
                                const blob = new Blob([result], {
                                    type: "text/plain",
                                });

                                // Create a download link and trigger download
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement("a");
                                a.href = url;
                                a.download =
                                    "artifacts_" +
                                    new Date()
                                        .toISOString()
                                        .replace(/[:.]/g, "-") +
                                    ".obj";
                                document.body.appendChild(a);
                                a.click();

                                // Cleanup
                                setTimeout(() => {
                                    inst.reset_download_flag();
                                    document.body.removeChild(a);
                                    URL.revokeObjectURL(url);
                                    Module.print(
                                        "Artifacts downloaded successfully!",
                                    );
                                    console.log(
                                        "Download triggered, cleanup complete",
                                    );
                                }, 100);
                            }
                        } catch (e) {
                            clearInterval(pollInterval);
                            console.error(
                                "Error during polling or artifact retrieval:",
                                e,
                            );
                            Module.print("Error: " + e.message);
                        }
                    }, 3000);
                },
            };
            Module.setStatus("Downloading...");
            window.onerror = (event) => {
                // TODO: do not warn on ok events like simulating an infinite loop or exitStatus
                Module.setStatus("Exception thrown, see JavaScript console");
                spinnerElement.style.display = "none";
                Module.setStatus = (text) => {
                    if (text) console.error("[post-exception status] " + text);
                };
            };
        </script>

        {{{ SCRIPT }}}
    </body>
</html>
